[project]
name = "portfolio-optimization"
version = "0.1.0"
description = "Otimização de portfólio, engenharia de dados medalhão e métricas por estratégia."
# numpy 2.5 exige Python 3.12+, por isso o piso é 3.12 (o CLAUDE.md cita 3.11+).
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
    "supabase>=2.34.1",
    # yfinance devolve pandas; a conversão para polars/numpy fica na Infrastructure.
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "scipy-stubs>=1.18.1.1",
]

# O projeto é instalado em modo editável pelo `uv sync`. Assim `domain`, `application`,
# `infrastructure` e `presentation` ficam importáveis de qualquer lugar, inclusive quando
# o Streamlit executa `src/presentation/app.py` (que só adiciona a pasta do script ao path).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain", "src/application", "src/infrastructure", "src/presentation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
# Letras gregas nas fórmulas das docstrings (σ, μ) são intencionais.
allowed-confusables = ["σ", "μ"]

[tool.ruff.lint.isort]
# A pasta `supabase/` (migrations) na raiz faz o ruff achar que `supabase` é módulo local.
known-third-party = ["supabase"]
known-first-party = ["domain", "application", "infrastructure", "presentation", "tests"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." permite importar `tests.fakes`; "src" é redundante com a instalação editável,
# mas mantém os testes rodando mesmo antes de um `uv sync`.
pythonpath = [".", "src"]

# yfinance não publica tipos; o retorno é tratado como Any e convertido para polars
# logo na fronteira do client.
[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true
